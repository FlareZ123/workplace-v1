name: H17 original cross-carrier six-vector retrieval
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only solver dependencies
        run: python -m pip install numpy scipy z3-solver
      - name: Retrieve only source-consistent p949..954 vectors
        run: python -m agents.agent50.k04_six_original_index_vectors
