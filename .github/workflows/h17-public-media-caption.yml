name: H17 public photograph caption census
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  caption-asset-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Read existing publicly linked image captions and assets
        run: python agents/agent4/k08_public_media_asset_census.py
