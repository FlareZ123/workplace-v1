name: H17 public correspondence sitemap source index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-index:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Read only standard public sitemap indexes
        run: python agents/agent11/k08_public_sitemap_source_probe.py
