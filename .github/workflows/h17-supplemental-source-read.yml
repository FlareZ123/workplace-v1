name: H17 supplemental local PDF review
on:
  workflow_dispatch:
jobs:
  local-pdf-review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Finite offline four-position numeric source-release check
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf cryptography
          python agents/agent9/bx25_numeric_release_sft.py
