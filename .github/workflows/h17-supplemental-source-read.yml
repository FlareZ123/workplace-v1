name: H17 supplemental local PDF review
on:
  workflow_dispatch:
jobs:
  local-pdf-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract locally committed PDF text and metadata
        shell: bash
        run: |
          set -euo pipefail
          SOURCE=resources/evidence/h17-supplemental-office-files/BX25-08.pdf
          sha256sum "$SOURCE"
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pypdf import PdfReader
          p="resources/evidence/h17-supplemental-office-files/BX25-08.pdf"
          r=PdfReader(p)
          print("TOTAL PAGES",len(r.pages))
          for i,page in enumerate(r.pages):
              print("=== PAGE",i+1,"START ===")
              print(page.extract_text(extraction_mode="layout") or "(NO TEXT LAYER)")
              print("=== PAGE",i+1,"END ===")
          PY
