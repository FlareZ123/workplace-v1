name: H17 supplemental local PDF metadata review
on:
  workflow_dispatch:
jobs:
  local-pdf-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Inspect newly supplied folio metadata
        shell: bash
        run: |
          set -euo pipefail
          sha256sum resources/evidence/h17-supplemental-office-files/BX25-08.pdf
          python -m pip install --quiet pypdf
          python -c 'from pypdf import PdfReader; r=PdfReader("resources/evidence/h17-supplemental-office-files/BX25-08.pdf"); print("encrypted",r.is_encrypted,"security_revision",r.trailer["/Encrypt"].get("/R"))'
