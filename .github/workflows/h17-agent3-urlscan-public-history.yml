name: H17 Public Urlscan Archive Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-history:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Query existing public site scans (read only)
        run: python3 agents/agent3/k08_urlscan_public_history.py
