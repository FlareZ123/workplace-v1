name: H17 source-labelled public correspondence index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-public-index:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe only six source-labelled anonymous paths
        run: python agents/agent31/k08_public_correspondence_index_sft.py
