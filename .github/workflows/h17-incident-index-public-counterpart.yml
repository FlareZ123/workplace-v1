name: H17 original incident index public counterpart
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-original-path-check:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source-addressed public equivalents
        run: python agents/agent15/incident_index_public_counterpart_sft.py
