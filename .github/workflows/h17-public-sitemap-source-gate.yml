name: H17 public sitemap source gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source-locator SFT
        uses: actions/checkout@v4
      - name: Inspect folio-named public sitemap, read-only
        run: python3 agents/agent46/h17_public_sitemap_gate.py
