name: K04 origin-conditioned 96-bit seed inversion
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invert:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {first: 356, last: 357}
          - {first: 358, last: 359}
          - {first: 360, last: 361}
          - {first: 362, last: 363}
          - {first: 364, last: 365}

    steps:
      - uses: actions/checkout@v4
      - name: Compile standalone source-conditioned seed inverter
        run: g++ -O3 -std=c++17 -march=native -pthread agents/agent3/k04_seed3_word.cpp -o agents/agent3/k04_seed3_word
      - name: Calibrate and exhaust fixed source phases
        run: python agents/agent3/k04_seed3_origin_scan.py --phase-min ${{ matrix.first }} --phase-max ${{ matrix.last }} --workers 2
