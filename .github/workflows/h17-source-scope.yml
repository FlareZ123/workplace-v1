name: H-17 read-only recovery regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-case-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Check out shared research
        uses: actions/checkout@v4
      - name: Validate original source-tree fingerprints
        run: python3 results/test_h17_source_tree_integrity.py
      - name: Run alternate-mask scope regression
        run: python3 results/test_h17_alternate_mask_scope.py
      - name: Run text-and-omission scope regression
        run: python3 results/test_h17_text_source_scope.py
      - name: Run all-file carrier scope regression
        run: python3 results/test_h17_all_carriers_scope.py
      - name: Run printer partial-echo source-scope regression
        run: python3 results/test_h17_partial_echoes_scope.py
      - name: Validate GF2 source-to-target quotient and affine correlation control
        run: python3 agents/agent33/k04_global_target_projection.py
      - name: Validate realistic two-selector GF2 target-rank calibration
        run: python3 agents/agent33/k04_realistic_producer_target_probe.py
      - name: Validate unchanged REC8 verifier controls
        run: python3 results/test_h17_verifier_controls.py
      - name: Exercise K01/K04/K05/K06 source selectors
        run: python3 results/test_h17_remaining_source_decoys.py
      - name: Exercise K02/K03/K07 source selectors
        run: python3 results/test_h17_replay_decoys.py
