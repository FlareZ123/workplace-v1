name: H-17 source-scope regressions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-source-membership:
    runs-on: ubuntu-latest
    steps:
      - name: Check out shared research
        uses: actions/checkout@v4
      - name: Run alternate-mask scope regression
        run: python3 results/test_h17_alternate_mask_scope.py
      - name: Run text-and-omission scope regression
        run: python3 results/test_h17_text_source_scope.py
      - name: Run all-file carrier scope regression
        run: python3 results/test_h17_all_carriers_scope.py
