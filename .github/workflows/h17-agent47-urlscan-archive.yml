name: H17 public source-linked archival scan index
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-archival-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check previously archived public index only
        run: python agents/agent47/h17_urlscan_archived_source_sft.py
