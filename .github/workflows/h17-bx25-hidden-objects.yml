name: H17 source PDF hidden object carrier audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install pypdf==5.9.0 cryptography
      - name: Audit all original folio objects read-only
        run: python agents/agent31/bx25_pdf_object_carrier_sft.py resources/evidence/h17-supplemental-office-files/BX25-08.pdf
