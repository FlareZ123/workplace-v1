name: H-17 independent original-source code index pilot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-index:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Probe two read-only public source indexes with known-positive controls
        run: python3 agents/agent27/h17_public_original_code_index_artifact.py
      - name: Save short original-source index summary
        uses: actions/upload-artifact@v4
        with:
          name: h17-agent27-public-index-results
          path: h17-agent27-public-index-results.jsonl
          retention-days: 1
